homelab:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'homelab.duckdb') }}"
      threads: 4
    trino:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      host: "{{ env_var('TRINO_HOST') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      database: "{{ env_var('TRINO_CATALOG', 'iceberg') }}"
      schema: "{{ env_var('TRINO_SCHEMA', 'homelab') }}"
      threads: 2
