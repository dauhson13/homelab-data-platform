homelab:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'homelab.duckdb') }}"
      threads: 4
    trino:
      type: trino
      method: ldap
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      password: "{{ env_var('LAKEHOUSE_PASSWORD', '') }}"
      host: "{{ env_var('LAKEHOUSE_HOST') }}"
      port: "{{ env_var('LAKEHOUSE_PORT', '8443') | as_number }}"
      http_scheme: https
      cert: false
      database: "{{ env_var('TRINO_CATALOG', 'iceberg') }}"
      schema: "{{ env_var('TRINO_SCHEMA', 'homelab') }}"
      threads: 2
